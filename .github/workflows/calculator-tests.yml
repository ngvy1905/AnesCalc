name: Validate AnesCalc calculations
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check logic.js
          node --check inhaled.js
          node --check inhaled-ui.js
          node --check washin.js
          node --check washin-ui.js
      - name: Existing calculator tests
        run: node tests.js
      - name: Inhaled anesthetic calculations tests
        run: node inhaled-tests.js
      - name: Circuit wash-in mathematical tests
        run: node washin-tests.js
